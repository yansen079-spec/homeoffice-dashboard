<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeOffice - Absensi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e6eaf0;padding:26px 18px}.brand{font-size:20px;font-weight:800;margin:0 10px 30px}.nav a{display:block;text-decoration:none;color:#596579;padding:12px 14px;border-radius:10px;margin:5px 0}.nav a.active,.nav a:hover{background:#eaf1ff;color:#2563eb;font-weight:700}.main{padding:30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0 0 6px}.muted{color:#7a8799;font-size:13px}.card{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(30,45,80,.05)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.stat b{font-size:30px;display:block;margin-top:8px}.tools{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}.tools div{display:flex;gap:8px}.input,.btn{border-radius:10px;padding:10px 12px;border:1px solid #e0e6ef;background:#fff}.btn{cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff;border:0}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:12px;color:#78859a}.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.hadir{background:#e8f7ed;color:#15803d}.telat{background:#fff3dc;color:#b45309}.izin{background:#eaf1ff;color:#2563eb}.sakit{background:#feecec;color:#b91c1c}.del{border:0;background:#f3f5f8;padding:7px 9px;border-radius:8px;cursor:pointer}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:22px;width:min(520px,100%)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{font-size:12px;color:#68758a;display:grid;gap:6px}.grid input,.grid select{padding:10px;border:1px solid #dfe5ed;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🏠 HomeOffice</div><nav class="nav"><a href="index.html">⌂ Dashboard</a><a class="active" href="absensi.html">◷ Absensi</a><a href="index.html">✓ Tugas</a><a href="index.html">♙ Karyawan</a><a href="index.html">□ Kalender</a><a href="index.html">▥ Laporan</a></nav></aside><main class="main">
<div class="top"><div><h1>Absensi</h1><div class="muted">Kelola kehadiran karyawan office.</div></div><button class="btn primary" id="add">+ Tambah Absensi</button></div>
<div class="stats"><div class="card stat"><span class="muted">Hadir</span><b id="sH">0</b></div><div class="card stat"><span class="muted">Terlambat</span><b id="sT">0</b></div><div class="card stat"><span class="muted">Izin</span><b id="sI">0</b></div><div class="card stat"><span class="muted">Sakit</span><b id="sS">0</b></div></div>
<div class="card"><div class="tools"><div><input class="input" type="date" id="filterDate"><select class="input" id="filterStatus"><option value="">Semua status</option><option>Hadir</option><option>Terlambat</option><option>Izin</option><option>Sakit</option></select></div><div class="muted">Data sementara tersimpan di browser ini</div></div><div class="table"><table><thead><tr><th>Nama</th><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Status</th><th>Catatan</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div>
<div class="modal" id="modal"><div class="box"><h3>Tambah Absensi</h3><div class="grid"><label>Nama<input id="name" placeholder="Nama karyawan"></label><label>Tanggal<input id="date" type="date"></label><label>Jam masuk<input id="in" type="time"></label><label>Jam pulang<input id="out" type="time"></label><label>Status<select id="status"><option>Hadir</option><option>Terlambat</option><option>Izin</option><option>Sakit</option></select></label><label>Catatan<input id="note" placeholder="Opsional"></label></div><div class="actions"><button class="btn" id="cancel">Batal</button><button class="btn primary" id="save">Simpan</button></div></div></div>
<script>
const $=s=>document.querySelector(s); let data=JSON.parse(localStorage.getItem('homeoffice_attendance')||'[]'); const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}; $('#filterDate').value=today();
function badge(s){return '<span class="badge '+(s==='Hadir'?'hadir':s==='Terlambat'?'telat':s==='Izin'?'izin':'sakit')+'">'+s+'</span>'}
function render(){let d=$('#filterDate').value,s=$('#filterStatus').value,shown=data.filter(x=>(!d||x.date===d)&&(!s||x.status===s));$('#rows').innerHTML=shown.length?shown.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.date}</td><td>${x.in||'-'}</td><td>${x.out||'-'}</td><td>${badge(x.status)}</td><td>${x.note||'-'}</td><td><button class="del" data-id="${x.id}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:#8793a5;padding:28px">Belum ada data absensi.</td></tr>';let td=data.filter(x=>x.date===today());$('#sH').textContent=td.filter(x=>x.status==='Hadir').length;$('#sT').textContent=td.filter(x=>x.status==='Terlambat').length;$('#sI').textContent=td.filter(x=>x.status==='Izin').length;$('#sS').textContent=td.filter(x=>x.status==='Sakit').length;document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{data=data.filter(x=>x.id!==b.dataset.id);localStorage.setItem('homeoffice_attendance',JSON.stringify(data));render()})}
$('#add').onclick=()=>{$('#date').value=today();$('#modal').classList.add('open')};$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#filterDate').onchange=render;$('#filterStatus').onchange=render;$('#save').onclick=()=>{if(!$('#name').value.trim()||!$('#date').value){alert('Nama dan tanggal wajib diisi');return}data.push({id:String(Date.now()),name:$('#name').value.trim(),date:$('#date').value,in:$('#in').value,out:$('#out').value,status:$('#status').value,note:$('#note').value.trim()});localStorage.setItem('homeoffice_attendance',JSON.stringify(data));$('#modal').classList.remove('open');$('#name').value=$('#in').value=$('#out').value=$('#note').value='';render()};render();
</script></body></html>
