<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YANSMART • Detail Produk</title>
<meta name="theme-color" content="#050b18">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050b18;--panel:#0d1527;--panel2:#101a30;--line:#293754;--text:#f7f8fc;--muted:#93a0b8;--purple:#7c3cff;--blue:#3b82f6;--green:#22c55e;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(59,130,246,.11),transparent 25%),radial-gradient(circle at 85% 10%,rgba(124,60,255,.14),transparent 25%),var(--bg);color:var(--text)}button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.shell{width:min(1220px,calc(100% - 34px));margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(4,10,24,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(148,163,184,.15)}.nav{height:72px;display:flex;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #7657ff;object-fit:cover;box-shadow:0 0 24px rgba(124,60,255,.35)}.brandname{font-weight:1000;font-size:21px;letter-spacing:-.03em}.brandname span{background:linear-gradient(90deg,#a855f7,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}.tag{font-size:10px;color:var(--muted)}.navbtn{height:40px;border:1px solid #2a3856;background:#10192c;border-radius:12px;padding:0 14px;font-weight:850;cursor:pointer}.seller{background:linear-gradient(135deg,#7444ef,#5928da);border-color:#6d3bea}
.main{padding:26px 0 54px}.crumb{display:flex;gap:8px;align-items:center;color:#8996ae;font-size:12px;margin-bottom:16px}.crumb a:hover{color:#c4b5fd}.product{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:22px;align-items:start}.visual{min-height:500px;border:1px solid #293754;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 25% 15%,rgba(59,130,246,.22),transparent 28%),radial-gradient(circle at 78% 20%,rgba(124,60,255,.28),transparent 30%),linear-gradient(135deg,#08152d,#160a2d);display:grid;place-items:center;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.3)}.visual img{width:100%;height:100%;min-height:500px;object-fit:cover}.fallback{width:140px;height:140px;border-radius:38px;display:grid;place-items:center;font-size:66px;background:#071124cc;border:1px solid #6d56dd;box-shadow:0 0 55px rgba(124,60,255,.32)}.ready{position:absolute;top:16px;left:16px;padding:8px 11px;border-radius:999px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);color:#86efac;font-size:11px;font-weight:950}.soldout{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.35);color:#fca5a5}
.panel{border:1px solid #293754;border-radius:24px;background:linear-gradient(180deg,#0d1527,#09111f);padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.sellerRow{display:flex;align-items:center;gap:10px;cursor:pointer;transition:.18s ease;padding:12px;border:1px solid #25334f;border-radius:15px;background:#0b1426;margin-bottom:18px}.sellerRow:hover{border-color:#6d4be8;transform:translateY(-1px)}.avatar{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7543f2,#2769df);display:grid;place-items:center;font-weight:1000}.sellerName{font-weight:950}.verified{font-size:11px;color:#93c5fd;margin-top:2px}h1{font-size:clamp(28px,4vw,43px);line-height:1.08;letter-spacing:-.04em;margin:0}.desc{color:#a8b2c7;line-height:1.7;font-size:14px;margin:14px 0 18px;white-space:pre-wrap}.price{font-size:34px;font-weight:1000;color:#c4b5fd;margin:12px 0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.chip{border:1px solid #334155;border-radius:999px;padding:8px 11px;font-size:11px;color:#cbd5e1;font-weight:850}.stock{color:#86efac}.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:10px}.action{border:1px solid #334155;border-radius:13px;padding:13px 14px;background:#111b30;font-weight:950;cursor:pointer}.buy{border:0;background:linear-gradient(135deg,#7c3cff,#4f46e5)}.action:disabled{opacity:.45;cursor:not-allowed}.secure{margin-top:14px;padding:13px;border:1px solid rgba(34,197,94,.22);border-radius:14px;background:rgba(34,197,94,.06);font-size:11px;color:#a7f3d0;line-height:1.55}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.info div{border:1px solid #26344f;border-radius:14px;padding:12px;background:#0b1426}.info b{display:block;font-size:11px}.info span{display:block;color:#8f9ab0;font-size:10px;margin-top:4px}.support{margin-top:20px;border:1px solid #293754;border-radius:20px;padding:18px;background:#0b1426}.support h3{margin:0 0 7px;font-size:15px}.support p{margin:0;color:#94a3b8;font-size:12px;line-height:1.55}.toast{position:fixed;right:20px;bottom:20px;max-width:340px;background:#111b30;border:1px solid #374663;border-radius:14px;padding:13px 15px;box-shadow:0 20px 60px #0009;display:none;font-size:12px;line-height:1.5}.toast.show{display:block}
.langWrap{position:relative}.lang{display:flex;align-items:center;gap:8px;min-width:150px;justify-content:center}.flag{width:25px;height:17px;border-radius:3px;box-shadow:0 0 0 1px #ffffff2b;display:inline-block;overflow:hidden}.flag.id{background:linear-gradient(to bottom,#e70011 0 50%,#fff 50% 100%)}.flag.en{background:#174a9c;position:relative}.flag.en:before{content:"✚";position:absolute;color:white;font-size:24px;line-height:16px;left:3px;top:-2px}.langMenu{display:none;position:absolute;right:0;top:48px;width:230px;background:#0b1428;border:1px solid #2b3b5c;border-radius:14px;overflow:hidden;box-shadow:0 20px 55px #000a}.langMenu.open{display:block}.langMenu button{width:100%;border:0;background:transparent;color:white;padding:13px 14px;text-align:left;font-weight:850;cursor:pointer}.langMenu button:hover{background:#111d36}
.loading,.error{min-height:420px;display:grid;place-items:center;border:1px dashed #334155;border-radius:22px;color:#94a3b8;text-align:center;padding:30px}
@media(max-width:850px){.product{grid-template-columns:1fr}.visual,.visual img{min-height:340px}.nav .seller{display:none}.lang{min-width:62px}.langLabel{display:none}}@media(max-width:560px){.shell{width:min(100% - 20px,1220px)}.brandname{font-size:17px}.tag{display:none}.actions{grid-template-columns:1fr}.info{grid-template-columns:1fr}.panel{padding:17px}}
</style>
</head>
