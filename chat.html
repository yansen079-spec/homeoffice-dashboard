<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YANSMART Chat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#050b19;color:#edf2ff;font-family:Arial,system-ui}.top{height:70px;padding:0 5vw;border-bottom:1px solid #21304d;display:flex;align-items:center;justify-content:space-between}.top a{color:white;text-decoration:none;font-weight:900}.wrap{max-width:900px;margin:30px auto;padding:0 15px}.chat{background:#091426;border:1px solid #273959;border-radius:20px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #21304d}.head h2{margin:0}.muted{color:#8fa0bc;font-size:13px}.messages{height:55vh;min-height:380px;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:78%;padding:11px 14px;border-radius:15px;white-space:pre-wrap;word-break:break-word}.buyer{align-self:flex-end;background:#6d3df5}.seller{align-self:flex-start;background:#14243e;border:1px solid #294064}.time{display:block;font-size:10px;opacity:.65;margin-top:5px}.send{display:flex;gap:8px;padding:14px;border-top:1px solid #21304d}.send textarea{flex:1;resize:none;background:#0d1a31;color:white;border:1px solid #2a3d60;border-radius:12px;padding:12px;min-height:48px}.send button,.login a{border:0;border-radius:12px;padding:0 20px;background:linear-gradient(90deg,#7040ff,#218ce8);color:white;font-weight:900}.empty,.login{text-align:center;color:#8fa0bc;padding:45px}.login a{display:inline-block;padding:12px 18px;text-decoration:none;margin-top:12px}</style></head><body><header class="top"><a id="back" href="marketplace.html">← Marketplace</a><b id="roleTitle">💬 Chat Seller</b></header><main class="wrap"><div class="chat"><div class="head"><h2 id="title">Percakapan YANSMART</h2><div class="muted">Pesan langsung buyer dan seller</div></div><div id="chatBody"><div class="messages" id="messages"><div class="empty">Memuat...</div></div><div class="send"><textarea id="msg" maxlength="2000" placeholder="Tulis pesan..."></textarea><button id="sendBtn">Kirim</button></div></div></div></main><script>
const sb=supabase.createClient('https://ltffbxrggflevlilqmze.supabase.co','sb_publishable_svtQE6pna4HvyU07igxRnA_eUdi0rNJ');
const q=new URLSearchParams(location.search);let thread=q.get('thread');const seller=q.get('seller'),listing=q.get('listing'),sellerMode=q.get('mode')==='seller';let busy=false,lastSig='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(sellerMode){$('back').href='seller.html';$('back').textContent='← Seller Center';$('roleTitle').textContent='💬 Chat Buyer'}
function showState(title,detail='',retry=false){$('messages').innerHTML=`<div class="empty"><b style="color:#eaf0ff">${esc(title)}</b>${detail?`<div style="margin-top:8px">${esc(detail)}</div>`:''}${retry?'<button id="retryBtn" style="margin-top:16px;border:0;border-radius:10px;padding:10px 16px;background:#7040ff;color:white;font-weight:900;cursor:pointer">Coba Lagi</button>':''}</div>`;if(retry)$('retryBtn').onclick=init}
function setComposer(on){$('msg').disabled=!on;$('sendBtn').disabled=!on;$('msg').placeholder=on?'Tulis pesan...':'Percakapan belum siap...'}
async function withTimeout(promise,ms=12000){let timer;try{return await Promise.race([promise,new Promise((_,rej)=>timer=setTimeout(()=>rej(new Error('Koneksi ke server terlalu lama.')),ms))])}finally{clearTimeout(timer)}}
async function init(){if(busy)return;busy=true;setComposer(false);showState('Memuat percakapan...','Menghubungkan ke YANSMART.');try{
 const {data:{session},error:sErr}=await withTimeout(sb.auth.getSession());if(sErr)throw sErr;if(!session){$('chatBody').innerHTML='<div class="login">Silakan login terlebih dahulu.<br><a href="'+(sellerMode?'seller.html':'account.html?mode=login')+'">Masuk</a></div>';return}
 if(!thread){if(!seller)throw new Error('ID seller tidak ditemukan dari halaman produk.');const {data,error}=await withTimeout(sb.rpc('start_marketplace_chat_v4223',{p_seller_id:seller,p_listing_id:listing||null}));if(error)throw error;if(!data)throw new Error('Server tidak mengembalikan ID percakapan.');thread=data;history.replaceState({},'',`chat.html?thread=${encodeURIComponent(thread)}${sellerMode?'&mode=seller':''}`)}
 await load(true);setComposer(true);setInterval(()=>load(false),4000)
}catch(e){console.error('YANSMART CHAT INIT',e);showState('Chat belum dapat dimuat',e?.message||'Terjadi kesalahan saat membuka percakapan.',true)}finally{busy=false}}
async function load(force=false){if(!thread)return;try{const {data,error}=await withTimeout(sb.rpc('get_marketplace_chat_thread_v42232',{p_thread_id:thread}),10000);if(error)throw error;if(!data)throw new Error('Data percakapan kosong.');const viewer=data.viewer_role||'buyer';const title=viewer==='seller'?`Chat dengan ${data.buyer_email||'Buyer YANSMART'}`:`Chat dengan ${data.seller_name||'Seller YANSMART'}`;$('title').textContent=title;const sub=document.querySelector('.head .muted');if(sub)sub.textContent=data.listing_title?`Produk: ${data.listing_title}`:'Pesan langsung buyer dan seller';const ms=Array.isArray(data.messages)?data.messages:[];const sig=ms.map(x=>x.id+':'+x.read_at).join('|');if(force||sig!==lastSig){lastSig=sig;$('messages').innerHTML=ms.length?ms.map(x=>`<div class="bubble ${x.sender_role}">${esc(x.message)}<span class="time">${new Date(x.created_at).toLocaleString('id-ID')}</span></div>`).join(''):'<div class="empty"><b style="color:#eaf0ff">Belum ada pesan</b><div style="margin-top:8px">Mulai percakapan dengan '+esc(data.seller_name||'seller')+' 👋</div></div>';$('messages').scrollTop=$('messages').scrollHeight}await sb.rpc('mark_marketplace_chat_read_v4223',{p_thread_id:thread});return data}catch(e){console.error('YANSMART CHAT LOAD',e);if(force)throw e}}
async function send(){const m=$('msg').value.trim();if(!m||!thread||busy)return;busy=true;$('sendBtn').disabled=true;try{const {error}=await withTimeout(sb.rpc('send_marketplace_chat_message_v4223',{p_thread_id:thread,p_message:m}));if(error)throw error;$('msg').value='';await load(true)}catch(e){alert('Pesan gagal dikirim: '+(e?.message||'Kesalahan server'))}finally{busy=false;$('sendBtn').disabled=false;$('msg').focus()}}
$('sendBtn').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};init();
</script></body></html>
