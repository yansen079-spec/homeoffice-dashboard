<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YANSMART Chat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#050b19;color:#edf2ff;font-family:Arial,system-ui}.top{height:70px;padding:0 5vw;border-bottom:1px solid #21304d;display:flex;align-items:center;justify-content:space-between}.top a{color:white;text-decoration:none;font-weight:900}.wrap{max-width:900px;margin:30px auto;padding:0 15px}.chat{background:#091426;border:1px solid #273959;border-radius:20px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #21304d}.head h2{margin:0}.muted{color:#8fa0bc;font-size:13px}.messages{height:55vh;min-height:380px;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:78%;padding:11px 14px;border-radius:15px;white-space:pre-wrap;word-break:break-word}.buyer{align-self:flex-end;background:#6d3df5}.seller{align-self:flex-start;background:#14243e;border:1px solid #294064}.time{display:block;font-size:10px;opacity:.65;margin-top:5px}.send{display:flex;gap:8px;padding:14px;border-top:1px solid #21304d}.send textarea{flex:1;resize:none;background:#0d1a31;color:white;border:1px solid #2a3d60;border-radius:12px;padding:12px;min-height:48px}.send button,.login a{border:0;border-radius:12px;padding:0 20px;background:linear-gradient(90deg,#7040ff,#218ce8);color:white;font-weight:900}.empty,.login{text-align:center;color:#8fa0bc;padding:45px}.login a{display:inline-block;padding:12px 18px;text-decoration:none;margin-top:12px}</style></head><body><header class="top"><a id="back" href="marketplace.html">← Marketplace</a><b id="roleTitle">💬 Chat Seller</b></header><main class="wrap"><div class="chat"><div class="head"><h2 id="title">Percakapan YANSMART</h2><div class="muted">Pesan langsung buyer dan seller</div></div><div id="chatBody"><div class="messages" id="messages"><div class="empty">Memuat...</div></div><div class="send"><textarea id="msg" maxlength="2000" placeholder="Tulis pesan..."></textarea><button id="sendBtn">Kirim</button></div></div></div></main><script>const sb=supabase.createClient('https://ltffbxrggflevlilqmze.supabase.co','sb_publishable_svtQE6pna4HvyU07igxRnA_eUdi0rNJ'),q=new URLSearchParams(location.search);let thread=q.get('thread');const seller=q.get('seller'),listing=q.get('listing'),sellerMode=q.get('mode')==='seller';if(sellerMode){back.href='seller.html';back.textContent='← Seller Center';roleTitle.textContent='💬 Chat Buyer'}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){chatBody.innerHTML='<div class="login">Silakan login terlebih dahulu.<br><a href="'+(sellerMode?'seller.html':'account.html?mode=login')+'">Masuk</a></div>';return}if(!thread){const {data,error}=await sb.rpc('start_marketplace_chat_v4223',{p_seller_id:seller,p_listing_id:listing||null});if(error){alert(error.message);return}thread=data;history.replaceState({},'',`chat.html?thread=${thread}${sellerMode?'&mode=seller':''}`)}await load();setInterval(load,4000)}async function load(){const {data,error}=await sb.from('marketplace_chat_messages').select('id,sender_role,message,created_at').eq('thread_id',thread).order('created_at');if(error)return;messages.innerHTML=data.length?data.map(x=>`<div class="bubble ${x.sender_role}">${esc(x.message)}<span class="time">${new Date(x.created_at).toLocaleString('id-ID')}</span></div>`).join(''):'<div class="empty">Belum ada pesan. Mulai percakapan 👋</div>';messages.scrollTop=messages.scrollHeight;await sb.rpc('mark_marketplace_chat_read_v4223',{p_thread_id:thread})}async function send(){const m=msg.value.trim();if(!m)return;sendBtn.disabled=true;const {error}=await sb.rpc('send_marketplace_chat_message_v4223',{p_thread_id:thread,p_message:m});sendBtn.disabled=false;if(error){alert(error.message);return}msg.value='';load()}sendBtn.onclick=send;msg.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};init()</script></body></html>
